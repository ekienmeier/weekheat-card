# Runs on every push and pull request: format, lint, types and tests of the card, that the
# committed card is the build of its sources, the YAML and Python style, and HACS's own checks.
name: Check

on:
  push:
  pull_request:

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The committed card is the build of the sources
        run: npm run build && git diff --exit-code dist/

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx run yamllint==1.35.1 --strict blueprints .github .yamllint.yaml
      - run: pipx run ruff==0.8.0 check tools
      - run: pipx run ruff==0.8.0 format --diff tools

  hacs:
    runs-on: ubuntu-latest
    steps:
      # The repository's description, topics and README images are GitHub settings that only the
      # default HACS store needs; Weekheat is installed as a custom repository.
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: description topics images
