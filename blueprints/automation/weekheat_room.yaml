blueprint:
  name: Weekheat room
  description: >-
    Heats a room by its day plans. Each plan is a schedule helper whose blocks
    carry a temperature. The Weekheat day script says whether today is a working
    day or a free day (or names a plan); the week picks the plan for working
    days, the free-day plan is used on free days. The thermostats are written
    only when the scheduled temperature changes, so a change made by hand holds
    until the next period with a different temperature.
    Optional window and door sensors: while one is open (for the delay), the
    thermostats are set to 5 °C; when all are closed again, the setpoints from
    before are restored, or the plan's temperature if a period with a different
    temperature began in between.
    Optional heating switch (an input_boolean): while it is off, the thermostats
    are held at 5 °C and windows are ignored; switched on, the plan applies again.
    Optional valve exercise, once a week: all thermostats go to 30 °C and 5 °C, twice,
    then back to the setpoints from before (or to the plan's temperature if a period with
    a different temperature began in between). Other events wait until it is done.
    Pairs with the Weekheat card (custom:weekheat-card).
  domain: automation
  source_url: https://github.com/ekienmeier/weekheat-card/blob/main/blueprints/automation/weekheat_room.yaml
  input:
    room_name:
      name: Room name
      selector:
        text: {}
    thermostats:
      name: Thermostats
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate
    plans:
      name: Plans
      description: The room's day plans (schedule helpers).
      selector:
        entity:
          multiple: true
          filter:
            - domain: schedule
    week:
      name: Week
      description: The plan for a working day on each weekday. A day left empty uses the first plan.
      default: {}
      selector:
        object:
          fields:
            mon: {label: Monday, selector: {entity: {filter: [{domain: schedule}]}}}
            tue: {label: Tuesday, selector: {entity: {filter: [{domain: schedule}]}}}
            wed: {label: Wednesday, selector: {entity: {filter: [{domain: schedule}]}}}
            thu: {label: Thursday, selector: {entity: {filter: [{domain: schedule}]}}}
            fri: {label: Friday, selector: {entity: {filter: [{domain: schedule}]}}}
            sat: {label: Saturday (only if made a working day), selector: {entity: {filter: [{domain: schedule}]}}}
            sun: {label: Sunday (only if made a working day), selector: {entity: {filter: [{domain: schedule}]}}}
    free_day:
      name: Free-day plan
      selector:
        entity:
          filter:
            - domain: schedule
    windows:
      name: Window and door sensors
      description: While one of them is open, the room's thermostats are set to 5 °C.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class: [window, door, opening, garage_door]
            - domain: input_boolean
    window_delay:
      name: Window delay
      description: How long a window or door must be open before the heating turns down.
      default: 30
      selector:
        number:
          min: 0
          max: 900
          unit_of_measurement: seconds
    heating_switch:
      name: Heating switch
      description: >-
        Optional input_boolean. Off holds the thermostats at 5 °C; on lets the plan heat again.
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean
    exercise_day:
      name: Valve exercise day
      description: Weekday of the weekly valve exercise, or off.
      default: "off"
      selector:
        select:
          options:
            - {value: "off", label: "Off"}
            - {value: mon, label: Monday}
            - {value: tue, label: Tuesday}
            - {value: wed, label: Wednesday}
            - {value: thu, label: Thursday}
            - {value: fri, label: Friday}
            - {value: sat, label: Saturday}
            - {value: sun, label: Sunday}
    exercise_time:
      name: Valve exercise time
      default: "13:00:00"
      selector:
        time: {}
    exercise_wait:
      name: Valve exercise wait
      description: How long the valves are held fully open and fully closed, each time.
      default: 60
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds
    state:
      name: State helper
      description: An input_text (max 255) where the automation keeps what it last applied.
      selector:
        entity:
          filter:
            - domain: input_text
    day_script:
      name: Day script
      default: script.weekheat_day
      selector:
        entity:
          filter:
            - domain: script
    settle_time:
      name: Settle time
      description: How long to wait for a thermostat to confirm a new setpoint.
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
    language:
      name: Notification language
      default: en
      selector:
        select:
          options:
            - {value: en, label: English}
            - {value: de, label: Deutsch}

mode: queued
max: 10

variables:
  room_name: !input room_name
  thermostats: !input thermostats
  plans: !input plans
  week: !input week
  free_day: !input free_day
  state_entity: !input state
  day_script: !input day_script
  settle_time: !input settle_time
  language: !input language
  windows: !input windows
  window_delay: !input window_delay
  heating_switch: !input heating_switch
  exercise_day: !input exercise_day
  exercise_wait: !input exercise_wait

triggers:
  - trigger: state
    entity_id: !input plans
    id: plan
  - trigger: state
    entity_id: !input thermostats
    from: unavailable
    id: back
  - trigger: time
    at: "00:00:05"
    id: midnight
  - trigger: time_pattern
    minutes: /15
    id: tick
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: !input windows
    to: "on"
    for:
      seconds: !input window_delay
    id: window
  - trigger: state
    entity_id: !input windows
    from: "on"
    id: window
  - trigger: state
    entity_id: !input heating_switch
    to: ["on", "off"]
    id: switch
  - trigger: time
    at: !input exercise_time
    id: exercise
  # Run now (the card's button): optional entity_id, a room automation or a list of them.
  - trigger: event
    event_type: weekheat_exercise
    id: exercise_now

actions:
  # Valve exercise: open fully, close fully, twice; then the setpoints from before. Runs first, so the
  # normal run below sees what it restored and writes a new period's temperature if one began meanwhile.
  - if:
      - condition: template
        value_template: >-
          {%- set want = (trigger.event.data.entity_id | default([])) if trigger.id == 'exercise_now' else [] -%}
          {%- set want = [want] if want is string else want | list -%}
          {{ (trigger.id == 'exercise' and exercise_day == ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()])
             or (trigger.id == 'exercise_now' and (not want or this.entity_id in want)) }}
    then:
      - variables:
          ex_list: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in ([thermostats] if thermostats is string else thermostats | list) -%}
              {%- set t = state_attr(th, 'temperature') -%}
              {%- if states(th) not in ['unavailable', 'unknown'] -%}
                {%- set ns.l = ns.l + [[th, t | float if t is number else none, states(th)]] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          ex_th: "{{ ex_list | map(attribute=0) | list }}"
          ex_state: >-
            {%- set s = states(state_entity) -%}
            {{ s | from_json if s.startswith('{') else {} }}
      - condition: template
        value_template: "{{ ex_th | length > 0 }}"
      # Marks the room for the card while it runs.
      - action: input_text.set_value
        target:
          entity_id: !input state
        data:
          value: "{{ dict(ex_state, _ex=1) | to_json }}"
      - if:
          - condition: template
            value_template: "{{ ex_list | selectattr(2, 'eq', 'off') | list | length > 0 }}"
        then:
          - action: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: "{{ ex_list | selectattr(2, 'eq', 'off') | map(attribute=0) | list }}"
            data:
              hvac_mode: heat
      - repeat:
          count: 2
          sequence:
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ ex_th }}"
              data:
                temperature: 30
            - delay:
                seconds: "{{ exercise_wait | int(60) }}"
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ ex_th }}"
              data:
                temperature: 5
            - delay:
                seconds: "{{ exercise_wait | int(60) }}"
      - repeat:
          for_each: "{{ ex_list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item[1] is number }}"
              then:
                - action: climate.set_temperature
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    temperature: "{{ repeat.item[1] }}"
            - if:
                - condition: template
                  value_template: "{{ repeat.item[2] == 'off' }}"
              then:
                - action: climate.set_hvac_mode
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    hvac_mode: "off"
      - wait_template: >-
          {%- set ns = namespace(ok=true) -%}
          {%- for it in ex_list if it[1] is number -%}
            {%- if (state_attr(it[0], 'temperature') | float(-100) - it[1]) | abs >= 0.25 -%}{%- set ns.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.ok }}
        timeout:
          seconds: "{{ settle_time }}"
        continue_on_timeout: true
      - action: input_text.set_value
        target:
          entity_id: !input state
        data:
          value: "{{ ex_state | to_json }}"

  - action: "{{ day_script }}"
    response_variable: day_info
  - variables:
      day: "{{ day_info.days[0] }}"
      plan_list: "{{ [plans] if plans is string else plans | list }}"
      named_plan: >-
        {%- set ns = namespace(p=none) -%}
        {%- if day.plan -%}
          {%- set want = day.plan | lower -%}{%- set slug = day.plan | slugify -%}
          {%- for p in plan_list if ns.p is none -%}
            {%- set fn = (state_attr(p, 'friendly_name') or '') | lower -%}
            {%- if p.endswith('_' ~ slug) or fn == want or fn.endswith(' ' ~ want) -%}{%- set ns.p = p -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.p or '' }}
      plan: >-
        {%- if named_plan -%}{{ named_plan }}
        {%- elif day.free -%}{{ free_day }}
        {%- else -%}{{ (week or {}).get(day.weekday) or plan_list[0] }}{%- endif -%}
      wanted: >-
        {%- set t = state_attr(plan, 'temperature') -%}
        {{ t | float if is_state(plan, 'on') and t is number else none }}
      applied: >-
        {%- set s = states(state_entity) -%}
        {{ s | from_json if s.startswith('{') else {} }}
      stamp: "{{ now().strftime('%Y-%m-%dT%H:%M') }}"
      late: []
      targets: []
      th_list: "{{ [thermostats] if thermostats is string else thermostats | list }}"
      win_list: "{{ [windows] if windows is string else (windows or []) | list }}"
      # A window counts as open once it has been open for the delay.
      open_now: >-
        {%- set ns = namespace(o=false) -%}
        {%- for w in win_list if is_state(w, 'on') -%}
          {%- if (now() - states[w].last_changed).total_seconds() >= (window_delay | float(0)) - 1 -%}{%- set ns.o = true -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.o }}
      saved: "{{ applied.get('_open') }}"
      switch_off: >-
        {%- set sw = heating_switch[0] if heating_switch is list and heating_switch else heating_switch -%}
        {{ sw is string and sw != '' and is_state(sw, 'off') }}
      mode: >-
        {%- if switch_off -%}off
        {%- elif open_now -%}{{ 'hold' if saved is list else 'open' }}
        {%- else -%}{{ 'restore' if saved is list else 'plan' }}{%- endif -%}

  # Window opened: remember the setpoints (in thermostat order) and turn down. When the heating was
  # just switched on with a window open, remember the plan's temperature instead of the 5 °C.
  - if:
      - condition: template
        value_template: "{{ mode == 'open' }}"
    then:
      - variables:
          from_switch: "{{ trigger.id == 'switch' and wanted is number }}"
          saved: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set t = state_attr(th, 'temperature') -%}
              {%- if from_switch -%}{%- set ns.l = ns.l + [wanted] -%}
              {%- else -%}{%- set ns.l = ns.l + [t | float if states(th) not in ['off', 'unavailable', 'unknown'] and t is number else none] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          applied: >-
            {%- set ns = namespace(a=applied) -%}
            {%- if from_switch -%}{%- for th in th_list -%}{%- set ns.a = dict(ns.a, **{th: [wanted, stamp]}) -%}{%- endfor -%}{%- endif -%}
            {{ dict(ns.a, _open=saved) }}
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- if saved[loop.index0] is number and saved[loop.index0] > 5.05 -%}{%- set ns.l = ns.l + [[th, 5]] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}

  # Window still open: write nothing, but let a new period's temperature replace what will be restored.
  - if:
      - condition: template
        value_template: "{{ mode == 'hold' }}"
    then:
      - variables:
          news: >-
            {%- set ns = namespace(a={}, s=[]) -%}
            {%- for th in th_list -%}
              {%- set last = (applied.get(th) or [none])[0] -%}
              {%- set old = saved[loop.index0] if loop.index0 < saved | length else none -%}
              {%- if wanted is number and (last is not number or (last - wanted) | abs >= 0.05) -%}
                {%- set ns.a = dict(ns.a, **{th: [wanted, stamp]}) -%}{%- set ns.s = ns.s + [wanted] -%}
              {%- else -%}{%- set ns.s = ns.s + [old] -%}{%- endif -%}
            {%- endfor -%}
            {{ {'a': ns.a, 's': ns.s} }}
          applied: "{{ dict(applied, _open=news.s, **news.a) }}"
          # A thermostat that was unavailable when the window opened: turn it down now that it is back.
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set t = state_attr(th, 'temperature') -%}
              {%- if trigger.id == 'back' and trigger.entity_id == th and states(th) != 'off' and t is number and t > 5.05 -%}
                {%- set ns.l = ns.l + [[th, 5]] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}

  # All windows closed: restore.
  - if:
      - condition: template
        value_template: "{{ mode == 'restore' }}"
    then:
      - variables:
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set v = saved[loop.index0] if loop.index0 < saved | length else none -%}
              {%- if v is number -%}{%- set ns.l = ns.l + [[th, v]] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          applied: "{{ dict(applied.items() | rejectattr(0, 'eq', '_open') | list) }}"

  # Heating switched off: forget an open window, hold 5 °C (written once, like a plan value).
  - if:
      - condition: template
        value_template: "{{ mode == 'off' }}"
    then:
      - variables:
          applied: "{{ dict(applied.items() | rejectattr(0, 'eq', '_open') | list) }}"
          wanted: 5

  # Normal run (or off): write the plan's temperature where it changed.
  - if:
      - condition: template
        value_template: "{{ mode in ['plan', 'off'] }}"
    then:
      # Nothing scheduled right now (a gap between blocks, or the plan is missing): leave everything alone.
      - condition: template
        value_template: "{{ wanted is number }}"
      - variables:
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set last = (applied.get(th) or [none])[0] -%}
              {%- if last is not number or (last - wanted) | abs >= 0.05 -%}{%- set ns.l = ns.l + [[th, wanted]] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}

  # Window states are saved before writing, so the card shows them at once.
  - if:
      - condition: template
        value_template: "{{ mode not in ['plan', 'off'] and (applied | to_json) != states(state_entity) }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input state
        data:
          value: "{{ applied | to_json }}"

  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            th: "{{ repeat.item[0] }}"
            temp: "{{ repeat.item[1] | float }}"
            last: "{{ (applied.get(th) or [none])[0] }}"
        - if:
            - condition: template
              value_template: "{{ states(th) not in ['unavailable', 'unknown'] }}"
          then:
            # Switch an off thermostat on first: set_temperature's hvac_mode is ignored by some
            # integrations (seen with HomeKit Controller: the setpoint is taken, the mode stays off).
            - if:
                - condition: template
                  value_template: "{{ is_state(th, 'off') }}"
              then:
                - action: climate.set_hvac_mode
                  continue_on_error: true
                  target:
                    entity_id: "{{ th }}"
                  data:
                    hvac_mode: heat
                - wait_template: "{{ not is_state(th, 'off') }}"
                  timeout:
                    seconds: "{{ settle_time }}"
                  continue_on_timeout: true
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ th }}"
              data:
                temperature: "{{ temp }}"
            - wait_template: >-
                {{ (state_attr(th, 'temperature') | float(-100) - temp) | abs < 0.25
                   and not is_state(th, 'off') }}
              timeout:
                seconds: "{{ settle_time }}"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.completed and mode in ['plan', 'off'] }}"
              then:
                - variables:
                    applied: "{{ dict(applied, **{th: [temp, stamp]}) }}"
                    late: "{{ late + [state_attr(th, 'friendly_name') or th] if mode == 'plan' and trigger.id == 'start' and last is number else late }}"

  - if:
      - condition: template
        value_template: "{{ (applied | to_json) != states(state_entity) }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: !input state
        data:
          value: "{{ applied | to_json }}"

  # Home Assistant was not running when the period started: say so.
  - if:
      - condition: template
        value_template: "{{ late | length > 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "weekheat_{{ room_name | slugify }}_late"
          title: "Weekheat: {{ room_name }}"
          message: >-
            {%- set t = wanted | string ~ ' °C' -%}
            {%- if language == 'de' -%}
              {{ t }} wurde erst um {{ now().strftime('%H:%M') }} eingestellt ({{ late | join(', ') }}): Home Assistant lief nicht, als die Periode begann.
            {%- else -%}
              {{ t }} was only set at {{ now().strftime('%H:%M') }} ({{ late | join(', ') }}): Home Assistant was not running when the period started.
            {%- endif -%}
