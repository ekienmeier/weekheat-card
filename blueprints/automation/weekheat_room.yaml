blueprint:
  name: Weekheat room
  description: >-
    Heats a room by its day plans. Each plan is a schedule helper whose blocks
    carry a temperature. The Weekheat day script says whether today is a working
    day or a free day (or names a plan); the week picks the plan for working
    days, the free-day plan is used on free days. The thermostats are written
    only when the scheduled temperature changes, so a change made by hand holds
    until the next period with a different temperature.
    Optional window and door sensors: while one is open (for the delay), the
    thermostats are set to 5 °C; when all are closed again, the setpoints from
    before are restored, or the plan's temperature if a period with a different
    temperature began in between.
    Optional heating switch (an input_boolean): while it is off, the thermostats
    are held at 5 °C and windows are ignored; switched on, the plan applies again.
    Optional valve exercise, once a week: all thermostats go to 30 °C and 5 °C, twice,
    then back to the setpoints from before (or to the plan's temperature if a period with
    a different temperature began in between). Other events wait until it is done.
    Optional room sensor: Weekheat then holds the valves at 5 °C while the room is at
    least the margin above the setpoint, and gives the setpoint back once the room has
    cooled down to it. A workaround for thermostats that ignore a linked sensor or
    overshoot (e.g. the Aqara W600); not needed for ones that control well.
    Pairs with the Weekheat card (custom:weekheat-card). Weekheat 0.13.0
  domain: automation
  source_url: https://github.com/ekienmeier/weekheat-card/blob/main/blueprints/automation/weekheat_room.yaml
  input:
    room_name:
      name: Room name
      selector:
        text: {}
    thermostats:
      name: Thermostats
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate
    plans:
      name: Plans
      description: The room's day plans (schedule helpers).
      selector:
        entity:
          multiple: true
          filter:
            - domain: schedule
    week:
      name: Week
      description: The plan for a working day on each weekday. A day left empty uses the first plan.
      default: {}
      selector:
        object:
          fields:
            mon:
              label: Monday
              selector:
                entity:
                  filter:
                    - domain: schedule
            tue:
              label: Tuesday
              selector:
                entity:
                  filter:
                    - domain: schedule
            wed:
              label: Wednesday
              selector:
                entity:
                  filter:
                    - domain: schedule
            thu:
              label: Thursday
              selector:
                entity:
                  filter:
                    - domain: schedule
            fri:
              label: Friday
              selector:
                entity:
                  filter:
                    - domain: schedule
            sat:
              label: Saturday (only if made a working day)
              selector:
                entity:
                  filter:
                    - domain: schedule
            sun:
              label: Sunday (only if made a working day)
              selector:
                entity:
                  filter:
                    - domain: schedule
    free_day:
      name: Free-day plan
      selector:
        entity:
          filter:
            - domain: schedule
    windows:
      name: Window and door sensors
      description: While one of them is open, the room's thermostats are set to 5 °C.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class: [window, door, opening, garage_door]
            - domain: input_boolean
    window_delay:
      name: Window delay
      description: How long a window or door must be open before the heating turns down.
      default: 30
      selector:
        number:
          min: 0
          max: 900
          unit_of_measurement: seconds
    heating_switch:
      name: Heating switch
      description: >-
        Optional input_boolean. Off holds the thermostats at 5 °C; on lets the plan heat again.
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean
    exercise_day:
      name: Valve exercise day
      description: Weekday of the weekly valve exercise, or off.
      default: "off"
      selector:
        select:
          options:
            - {value: "off", label: "Off"}
            - {value: mon, label: Monday}
            - {value: tue, label: Tuesday}
            - {value: wed, label: Wednesday}
            - {value: thu, label: Thursday}
            - {value: fri, label: Friday}
            - {value: sat, label: Saturday}
            - {value: sun, label: Sunday}
    exercise_time:
      name: Valve exercise time
      default: "13:00:00"
      selector:
        time: {}
    exercise_wait:
      name: Valve exercise wait
      description: How long the valves are held fully open and fully closed, each time.
      default: 60
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: seconds
    room_sensor:
      name: Room sensor
      description: >-
        Optional, a workaround for thermostats that ignore a linked sensor or overshoot (e.g. the
        Aqara W600). While the room is at least the margin above the setpoint, the thermostats are
        held at 5 °C; once it is back down to the setpoint, they get the setpoint again. A setpoint
        below 10 °C set on the thermostat itself meanwhile is ignored (a nudge from the 5 °C shown).
      default: []
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_margin:
      name: Room margin
      description: How far above the setpoint the room must be before the valves are closed.
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 3
          step: 0.1
          unit_of_measurement: °C
    room_hold:
      name: Room hold
      description: Minimum time between two switches of the room sensor control (saves batteries).
      default: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: minutes
    state:
      name: State helper
      description: An input_text (max 255) where the automation keeps what it last applied.
      selector:
        entity:
          filter:
            - domain: input_text
    day_script:
      name: Day script
      default: script.weekheat_day
      selector:
        entity:
          filter:
            - domain: script
    settle_time:
      name: Settle time
      description: How long to wait for a thermostat to confirm a new setpoint.
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
    language:
      name: Notification language
      default: en
      selector:
        select:
          options:
            - {value: en, label: English}
            - {value: de, label: Deutsch}

mode: queued
max: 30

variables:
  room_name: !input room_name
  thermostats: !input thermostats
  plans: !input plans
  week: !input week
  free_day: !input free_day
  state_entity: !input state
  day_script: !input day_script
  settle_time: !input settle_time
  language: !input language
  windows: !input windows
  window_delay: !input window_delay
  heating_switch: !input heating_switch
  exercise_day: !input exercise_day
  exercise_wait: !input exercise_wait
  room_sensor: !input room_sensor
  room_margin: !input room_margin
  room_hold: !input room_hold
  # The most characters the state helper holds (its max, at most 255). A longer state is not saved
  # but reported, see the end.
  state_max: "{{ state_attr(state_entity, 'max') | int(255) }}"
  # Fixed values. The card has the same (src/domain/constants.js); tests/consistency.test.mjs checks
  # that they match.
  # The setpoint of Off, of an open window, of the heating switched off and of closed valves, in °C.
  off_temp: 5
  # Two setpoints closer than this are the same (a thermostat rounds what it is sent), in °C.
  same_setpoint: 0.25
  # Two wanted temperatures closer than this are unchanged, in °C.
  same_wanted: 0.05
  # A setpoint above this is more than off_temp, in °C.
  above_off: "{{ off_temp + same_wanted }}"
  # While the valves are held closed, a setpoint set by hand counts from this on, in °C; a lower one
  # is a nudge from the off_temp the thermostat shows, and is undone.
  by_hand_from: 10
  # The valve exercise's setpoints: fully open and fully closed, in °C.
  exercise_open: 30
  exercise_closed: 5
  # What a thermostat without a setpoint reads as, so that it differs from any setpoint.
  no_setpoint: -100
  # A window trigger can come a moment before its delay has passed, in seconds.
  window_slack: 1
  # Rounding allowance when the room temperature is compared with setpoint and margin, in °C.
  float_slack: 0.001
  # The weekday keys, Monday first, as the week uses them.
  weekdays:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  # The inputs, normalised once: lists are lists, and an optional entity is '' or its entity id.
  th_list: "{{ [thermostats] if thermostats is string else thermostats | list }}"
  win_list: "{{ [windows] if windows is string else (windows or []) | list }}"
  plan_list: "{{ [plans] if plans is string else plans | list }}"
  sensor_id: >-
    {%- set sensor = room_sensor[0] if room_sensor is list and room_sensor else room_sensor -%}
    {{ sensor if sensor is string else '' }}
  switch_id: >-
    {%- set switch = heating_switch[0] if heating_switch is list and heating_switch else heating_switch -%}
    {{ switch if switch is string else '' }}

triggers:
  - trigger: state
    entity_id: !input plans
    id: plan
  - trigger: state
    entity_id: !input thermostats
    from: unavailable
    id: back
  - trigger: time
    at: "00:00:05"
    id: midnight
  - trigger: time_pattern
    minutes: /15
    id: tick
  - trigger: homeassistant
    event: start
    id: start
  - trigger: state
    entity_id: !input windows
    to: "on"
    for:
      seconds: !input window_delay
    id: window
  - trigger: state
    entity_id: !input windows
    from: "on"
    id: window
  - trigger: state
    entity_id: !input heating_switch
    to:
      - "on"
      - "off"
    id: switch
  - trigger: time
    at: !input exercise_time
    id: exercise
  # Run now (the card's button): optional entity_id, a room automation or a list of them.
  - trigger: event
    event_type: weekheat_exercise
    id: exercise_now
  - trigger: state
    entity_id: !input room_sensor
    to:
    id: room
  # A setpoint changed (by hand or by Weekheat): only matters while the room sensor holds the valves closed.
  - trigger: state
    entity_id: !input thermostats
    attribute: temperature
    id: setpoint

actions:
  # A setpoint change only matters while the room sensor holds the valves closed, and only above
  # off_temp (its own writes of off_temp are not by hand).
  - condition: template
    value_template: >-
      {{ trigger.id != 'setpoint' or ('"_rc"' in states(state_entity)
         and (trigger.to_state.attributes.temperature | float(0)) > above_off) }}
  # Valve exercise: open fully, close fully, twice; then the setpoints from before. Runs first, so the
  # normal run below sees what it restored and writes a new period's temperature if one began meanwhile.
  - if:
      - condition: template
        value_template: >-
          {%- set want = (trigger.event.data.entity_id | default([])) if trigger.id == 'exercise_now' else [] -%}
          {%- set want = [want] if want is string else want | list -%}
          {{ (trigger.id == 'exercise' and exercise_day == weekdays[now().weekday()])
             or (trigger.id == 'exercise_now' and (not want or this.entity_id in want)) }}
    then:
      - variables:
          ex_list: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set t = state_attr(th, 'temperature') -%}
              {%- if states(th) not in ['unavailable', 'unknown'] -%}
                {%- set ns.l = ns.l + [[th, t | float if t is number else none, states(th)]] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          ex_th: "{{ ex_list | map(attribute=0) | list }}"
          ex_state: >-
            {%- set s = states(state_entity) -%}
            {{ s | from_json if s.startswith('{') else {} }}
      - condition: template
        value_template: "{{ ex_th | length > 0 }}"
      # Marks the room for the card while it runs (left out if the state would get too long).
      - if:
          - condition: template
            value_template: "{{ (dict(ex_state, _ex=1) | to_json | length) <= state_max }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: !input state
            data:
              value: "{{ dict(ex_state, _ex=1) | to_json }}"
      - if:
          - condition: template
            value_template: "{{ ex_list | selectattr(2, 'eq', 'off') | list | length > 0 }}"
        then:
          - action: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: "{{ ex_list | selectattr(2, 'eq', 'off') | map(attribute=0) | list }}"
            data:
              hvac_mode: heat
      - repeat:
          count: 2
          sequence:
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ ex_th }}"
              data:
                temperature: "{{ exercise_open }}"
            - delay:
                seconds: "{{ exercise_wait | int(60) }}"
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ ex_th }}"
              data:
                temperature: "{{ exercise_closed }}"
            - delay:
                seconds: "{{ exercise_wait | int(60) }}"
      - repeat:
          for_each: "{{ ex_list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item[1] is number }}"
              then:
                - action: climate.set_temperature
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    temperature: "{{ repeat.item[1] }}"
            - if:
                - condition: template
                  value_template: "{{ repeat.item[2] == 'off' }}"
              then:
                - action: climate.set_hvac_mode
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    hvac_mode: "off"
      - wait_template: >-
          {%- set ns = namespace(ok=true) -%}
          {%- for it in ex_list if it[1] is number -%}
            {%- if (state_attr(it[0], 'temperature') | float(no_setpoint) - it[1]) | abs >= same_setpoint -%}
              {%- set ns.ok = false -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.ok }}
        timeout:
          seconds: "{{ settle_time }}"
        continue_on_timeout: true
      - action: input_text.set_value
        target:
          entity_id: !input state
        data:
          value: "{{ ex_state | to_json }}"

  # Today's day decision. If the day script fails, the weekday alone decides (Saturday and Sunday
  # free), so that windows, the heating switch and the room sensor still work.
  - action: "{{ day_script }}"
    continue_on_error: true
    response_variable: day_info
  # Today's plan and the setpoint it wants, what was applied, and the inputs' states now.
  - variables:
      day: >-
        {%- set wkey = weekdays[now().weekday()] -%}
        {%- set fallback = {'weekday': wkey, 'free': wkey in weekdays[5:], 'plan': none} -%}
        {%- set answered = day_info is defined and day_info.days is defined and day_info.days -%}
        {{ day_info.days[0] if answered else fallback }}
      # The room's plans that the day's plan name (from an exception or a keyword rule) matches, in
      # three lists: same name without the room name (compared as slugs), the entity id the card
      # gives a plan of that name, and the entity id or name ends with it. Same rule as matchPlan
      # in the card; keep both alike.
      plan_hits: >-
        {%- set want = (day.plan or '') | slugify -%}
        {%- set prefix = (room_name | lower) ~ ' ' -%}
        {%- set own = 'schedule.weekheat_' ~ (room_name | slugify) ~ '_' ~ want -%}
        {%- set ns = namespace(label=[], own=[], ends=[]) -%}
        {%- for p in plan_list if want -%}
          {%- set fn = state_attr(p, 'friendly_name') or '' -%}
          {%- set label = fn[(prefix | length):] if (fn | lower).startswith(prefix) else fn -%}
          {%- set ns.label = ns.label + ([p] if (label | slugify) == want else []) -%}
          {%- set ns.own = ns.own + ([p] if p == own else []) -%}
          {%- set tail = p.endswith('_' ~ want) or (fn | lower).endswith(' ' ~ (day.plan | lower)) -%}
          {%- set ns.ends = ns.ends + ([p] if tail else []) -%}
        {%- endfor -%}
        {{ {'exact': ns.label + ns.own, 'ends': ns.ends} }}
      # An exact match first; a plan that only ends like the name, only if it is the only one
      # ("Werktag" must not pick "Kurzer Werktag").
      named_plan: >-
        {{ plan_hits.exact[0] if plan_hits.exact
           else (plan_hits.ends[0] if plan_hits.ends | length == 1 else '') }}
      plan: >-
        {%- if named_plan -%}{{ named_plan }}
        {%- elif day.free -%}{{ free_day }}
        {%- else -%}{{ (week or {}).get(day.weekday) or plan_list[0] }}{%- endif -%}
      wanted: >-
        {%- set t = state_attr(plan, 'temperature') -%}
        {{ t | float if is_state(plan, 'on') and t is number else none }}
      # The state as stored: per thermostat [the last setpoint applied], plus the markers _open,
      # _rc, _rt and _ex. Releases before 0.12.1 also stored a timestamp per thermostat; it is
      # dropped here, so the state gets shorter on its next save.
      applied: >-
        {%- set s = states(state_entity) -%}
        {%- set ns = namespace(d={}) -%}
        {%- for k, v in (s | from_json if s.startswith('{') else {}).items() -%}
          {%- set ns.d = dict(ns.d, **{k: v[:1] if v is list and not k.startswith('_') else v}) -%}
        {%- endfor -%}
        {{ ns.d }}
      late: []
      targets: []
      # A window counts as open once it has been open for the delay.
      open_now: >-
        {%- set ns = namespace(o=false) -%}
        {%- for w in win_list if is_state(w, 'on') -%}
          {%- if (now() - states[w].last_changed).total_seconds() >= (window_delay | float(0)) - window_slack -%}
            {%- set ns.o = true -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.o }}
      saved: "{{ applied.get('_open') }}"
      # Room sensor: its value, or none (no sensor, or no number right now).
      room_t: "{{ states(sensor_id) | float if sensor_id and is_number(states(sensor_id)) else none }}"
      rc_held: "{{ saved is list and applied.get('_rc') is not none }}"
      now_m: "{{ (now().timestamp() // 60) | int }}"
      rc_free: >-
        {{ applied.get('_rt') is not number or now_m - applied.get('_rt') >= room_hold | float(10) }}
      switch_off: "{{ switch_id != '' and is_state(switch_id, 'off') }}"
      mode: >-
        {%- if switch_off -%}off
        {%- elif open_now -%}{{ 'hold' if saved is list else 'open' }}
        {%- elif saved is list -%}{{ 'rc' if room_t is number else 'restore' }}
        {%- else -%}plan{%- endif -%}

  # Window opened: remember the setpoints (in thermostat order) and turn down. When the heating was
  # just switched on with a window open, remember the plan's temperature instead of the 5 °C.
  - if:
      - condition: template
        value_template: "{{ mode == 'open' }}"
    then:
      - variables:
          from_switch: "{{ trigger.id == 'switch' and wanted is number }}"
          saved: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set t = state_attr(th, 'temperature') -%}
              {%- if from_switch -%}{%- set ns.l = ns.l + [wanted] -%}
              {%- else -%}
                {%- set ns.l = ns.l + [t | float if states(th) not in ['off', 'unavailable', 'unknown'] and t is number else none] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          applied: >-
            {%- set ns = namespace(a=applied) -%}
            {%- if from_switch -%}{%- for th in th_list -%}{%- set ns.a = dict(ns.a, **{th: [wanted]}) -%}{%- endfor -%}{%- endif -%}
            {{ dict(ns.a, _open=saved) }}
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- if saved[loop.index0] is number and saved[loop.index0] > above_off -%}
                {%- set ns.l = ns.l + [[th, off_temp]] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}

  # Window still open: write nothing, but let a new period's temperature replace what will be restored.
  - if:
      - condition: template
        value_template: "{{ mode == 'hold' }}"
    then:
      - variables:
          news: >-
            {%- set ns = namespace(a={}, s=[]) -%}
            {%- for th in th_list -%}
              {%- set last = (applied.get(th) or [none])[0] -%}
              {%- set old = saved[loop.index0] if loop.index0 < saved | length else none -%}
              {%- if wanted is number and (last is not number or (last - wanted) | abs >= same_wanted) -%}
                {%- set ns.a = dict(ns.a, **{th: [wanted]}) -%}{%- set ns.s = ns.s + [wanted] -%}
              {%- else -%}{%- set ns.s = ns.s + [old] -%}{%- endif -%}
            {%- endfor -%}
            {{ {'a': ns.a, 's': ns.s} }}
          applied: "{{ dict(dict(applied.items() | rejectattr(0, 'eq', '_rc') | list), _open=news.s, **news.a) }}"
          # A thermostat that was unavailable when the window opened: turn it down now that it is back.
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set t = state_attr(th, 'temperature') -%}
              {%- if trigger.id == 'back' and trigger.entity_id == th and states(th) != 'off' and t is number and t > above_off -%}
                {%- set ns.l = ns.l + [[th, off_temp]] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}

  # All windows closed: restore.
  - if:
      - condition: template
        value_template: "{{ mode == 'restore' }}"
    then:
      - variables:
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list -%}
              {%- set v = saved[loop.index0] if loop.index0 < saved | length else none -%}
              {%- if v is number -%}{%- set ns.l = ns.l + [[th, v]] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          applied: "{{ dict(applied.items() | rejectattr(0, 'in', ['_open', '_rc']) | list) }}"

  # Room sensor holds the valves closed (or a window was just closed): keep them at 5 °C until the room
  # is back down to the setpoint. A new period's temperature or a setpoint set by hand (10 °C or more)
  # becomes the value given back later; anything lower is a nudge from the 5 °C on the thermostat's
  # display and is undone, the saved value stays.
  - if:
      - condition: template
        value_template: "{{ mode == 'rc' }}"
    then:
      - variables:
          news: >-
            {%- set ns = namespace(a={}, s=[], m=false) -%}
            {%- for th in th_list -%}
              {%- set last = (applied.get(th) or [none])[0] -%}
              {%- set old = saved[loop.index0] if loop.index0 < saved | length else none -%}
              {%- set cur = state_attr(th, 'temperature') -%}
              {%- if wanted is number and (last is not number or (last - wanted) | abs >= same_wanted) -%}
                {%- set ns.a = dict(ns.a, **{th: [wanted]}) -%}{%- set ns.s = ns.s + [wanted] -%}
              {%- elif rc_held and states(th) not in ['off', 'unavailable', 'unknown'] and cur is number and cur >= by_hand_from -%}
                {%- set ns.s = ns.s + [cur | float] -%}{%- set ns.m = true -%}
              {%- else -%}{%- set ns.s = ns.s + [old] -%}{%- endif -%}
            {%- endfor -%}
            {{ {'a': ns.a, 's': ns.s, 'm': ns.m} }}
          rc_max: "{{ news.s | select('number') | max if news.s | select('number') | list else none }}"
          # The hold time spaces out only the switches the room temperature causes; a new period or a
          # setpoint set by hand is let through at once.
          release: >-
            {{ room_t is not number or rc_max is not number
               or (room_t <= rc_max and (not rc_held or rc_free or news.m or news.a | length > 0)) }}
          base: "{{ dict(applied.items() | rejectattr(0, 'in', ['_open', '_rc']) | list) }}"
      - if:
          - condition: template
            value_template: "{{ release }}"
        then:
          - variables:
              applied: "{{ dict(base, _rt=now_m, **news.a) if rc_held else dict(base, **news.a) }}"
              targets: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for th in th_list -%}
                  {%- set v = news.s[loop.index0] -%}
                  {%- set cur = state_attr(th, 'temperature') -%}
                  {%- if v is number and not (cur is number and (cur - v) | abs < same_setpoint) -%}
                    {%- set ns.l = ns.l + [[th, v]] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}
        else:
          - variables:
              applied: "{{ dict(dict(base, **news.a), _open=news.s, _rc=1) }}"
              targets: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for th in th_list -%}
                  {%- set cur = state_attr(th, 'temperature') -%}
                  {%- if states(th) not in ['off', 'unavailable', 'unknown'] and cur is number and cur > above_off -%}
                    {%- set ns.l = ns.l + [[th, off_temp]] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}

  # Heating switched off: forget an open window, hold 5 °C (written once, like a plan value).
  - if:
      - condition: template
        value_template: "{{ mode == 'off' }}"
    then:
      - variables:
          applied: "{{ dict(applied.items() | rejectattr(0, 'in', ['_open', '_rc']) | list) }}"
          wanted: "{{ off_temp }}"

  # Normal run (or off): write the plan's temperature where it changed.
  - if:
      - condition: template
        value_template: "{{ mode in ['plan', 'off'] }}"
    then:
      # Nothing scheduled right now (a gap between blocks, or the plan is missing): leave the setpoints alone.
      - variables:
          targets: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for th in th_list if wanted is number -%}
              {%- set last = (applied.get(th) or [none])[0] -%}
              {%- if last is not number or (last - wanted) | abs >= same_wanted -%}{%- set ns.l = ns.l + [[th, wanted]] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}

  # Room sensor: the room is the margin above the setpoint (what the thermostats have after this run):
  # remember the setpoints and close the valves.
  - if:
      - condition: template
        value_template: "{{ mode == 'plan' and room_t is number and rc_free }}"
    then:
      - variables:
          eff: >-
            {%- set ns = namespace(l=[]) -%}
            {%- set tmap = dict(targets) -%}
            {%- for th in th_list -%}
              {%- set cur = state_attr(th, 'temperature') -%}
              {%- if states(th) in ['off', 'unavailable', 'unknown'] -%}{%- set ns.l = ns.l + [none] -%}
              {%- elif th in tmap -%}{%- set ns.l = ns.l + [tmap[th] | float] -%}
              {%- else -%}{%- set ns.l = ns.l + [cur | float if cur is number else none] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
          eff_max: "{{ eff | select('number') | max if eff | select('number') | list else none }}"
      - if:
          - condition: template
            value_template: "{{ eff_max is number and eff_max > above_off and room_t >= eff_max + room_margin | float(0.5) - float_slack }}"
        then:
          - variables:
              mode: close
              applied: >-
                {%- set ns = namespace(a=applied) -%}
                {%- for it in targets -%}{%- set ns.a = dict(ns.a, **{it[0]: [it[1] | float]}) -%}{%- endfor -%}
                {{ dict(ns.a, _open=eff, _rc=1, _rt=now_m) }}
              targets: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for th in th_list -%}
                  {%- if eff[loop.index0] is number and eff[loop.index0] > above_off -%}
                    {%- set ns.l = ns.l + [[th, off_temp]] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.l }}

  # Window states are saved before writing, so the card shows them at once.
  - if:
      - condition: template
        value_template: >-
          {{ mode not in ['plan', 'off'] and (applied | to_json) != states(state_entity)
             and (applied | to_json | length) <= state_max }}
    then:
      - action: input_text.set_value
        target:
          entity_id: !input state
        data:
          value: "{{ applied | to_json }}"

  - repeat:
      for_each: "{{ targets }}"
      sequence:
        - variables:
            th: "{{ repeat.item[0] }}"
            temp: "{{ repeat.item[1] | float }}"
            last: "{{ (applied.get(th) or [none])[0] }}"
        - if:
            - condition: template
              value_template: "{{ states(th) not in ['unavailable', 'unknown'] }}"
          then:
            # Switch an off thermostat on first: set_temperature's hvac_mode is ignored by some
            # integrations (seen with HomeKit Controller: the setpoint is taken, the mode stays off).
            - if:
                - condition: template
                  value_template: "{{ is_state(th, 'off') }}"
              then:
                - action: climate.set_hvac_mode
                  continue_on_error: true
                  target:
                    entity_id: "{{ th }}"
                  data:
                    hvac_mode: heat
                - wait_template: "{{ not is_state(th, 'off') }}"
                  timeout:
                    seconds: "{{ settle_time }}"
                  continue_on_timeout: true
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ th }}"
              data:
                temperature: "{{ temp }}"
            - wait_template: >-
                {{ (state_attr(th, 'temperature') | float(no_setpoint) - temp) | abs < same_setpoint
                   and not is_state(th, 'off') }}
              timeout:
                seconds: "{{ settle_time }}"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.completed and mode in ['plan', 'off'] }}"
              then:
                - variables:
                    applied: "{{ dict(applied, **{th: [temp]}) }}"
                    late: >-
                      {{ late + [state_attr(th, 'friendly_name') or th]
                         if mode == 'plan' and trigger.id == 'start' and last is number else late }}

  # Save the state. One that is longer than the helper holds would be dropped with only a warning
  # in the log, and the room would then rewrite its setpoints on every run: say so instead.
  - if:
      - condition: template
        value_template: "{{ (applied | to_json) != states(state_entity) }}"
    then:
      - if:
          - condition: template
            value_template: "{{ (applied | to_json | length) <= state_max }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: !input state
            data:
              value: "{{ applied | to_json }}"
        else:
          - action: persistent_notification.create
            data:
              notification_id: "weekheat_{{ room_name | slugify }}_state"
              title: "Weekheat: {{ room_name }}"
              message: >-
                {%- set n = applied | to_json | length -%}
                {%- if language == 'de' -%}
                  Der Zustand braucht {{ n }} Zeichen, {{ state_entity }} fasst {{ state_max }}:
                  zu viele Thermostate. Weniger Thermostate wählen oder ihnen kürzere Entity-IDs geben.
                {%- else -%}
                  The state needs {{ n }} characters, {{ state_entity }} holds {{ state_max }}:
                  too many thermostats. Pick fewer thermostats, or give them shorter entity ids.
                {%- endif -%}

  # Home Assistant was not running when the period started: say so.
  - if:
      - condition: template
        value_template: "{{ late | length > 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "weekheat_{{ room_name | slugify }}_late"
          title: "Weekheat: {{ room_name }}"
          message: >-
            {%- set number = '%g' | format(wanted) -%}
            {%- set t = (number | replace('.', ',') if language == 'de' else number) ~ ' °C' -%}
            {%- if language == 'de' -%}
              {{ t }} wurde erst um {{ now().strftime('%H:%M') }} eingestellt ({{ late | join(', ') }}):
              Home Assistant lief nicht, als die Periode begann.
            {%- else -%}
              {{ t }} was only set at {{ now().strftime('%H:%M') }} ({{ late | join(', ') }}):
              Home Assistant was not running when the period started.
            {%- endif -%}
